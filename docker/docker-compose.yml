# docker/docker-compose.yml
# Production Docker Compose Orchestration for ScholarFlow (Express.js REST API + PostgreSQL / MySQL Database)

version: '3.8'

services:
  # ============================================================
  # Express.js REST API Backend Service
  # ============================================================
  express-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: scholarflow-express-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://scholaruser:scholarpass@postgres-db:5432/scholarflow_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-scholarflow-jwt-key-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - scholarflow-network

  # ============================================================
  # PostgreSQL Database Service (Agnostic Database Engine)
  # ============================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: scholarflow-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scholarflow_db
      POSTGRES_USER: scholaruser
      POSTGRES_PASSWORD: scholarpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholaruser -d scholarflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarflow-network

# Network Isolation
networks:
  scholarflow-network:
    driver: bridge

# Persistent Data Storage
volumes:
  postgres-data:
    driver: local
