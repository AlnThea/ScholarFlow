# docker/nginx.conf
# Nginx Reverse Proxy Configuration for ScholarFlow (aaPanel / VPS ready with SSL & WebSocket support)

server {
    listen 80;
    server_name api.scholarflow.app;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.scholarflow.app;

    # SSL Certificates (aaPanel / Let's Encrypt / Certbot path)
    ssl_certificate /etc/letsencrypt/live/api.scholarflow.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.scholarflow.app/privkey.pem;

    # SSL Protocols & Performance Tuning
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression Tuning
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Express.js REST API Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Required for Realtime Sync WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Request Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long-Polling & SSE Streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Healthcheck Route
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
